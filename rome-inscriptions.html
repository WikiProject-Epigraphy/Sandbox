<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Rome inscriptions</title>

  <script>
    const query = `
#title: all inscriptions from Rome
PREFIX gp: <https://greek-metrical-inscriptions.wikibase.cloud/prop/>
PREFIX gpq: <https://greek-metrical-inscriptions.wikibase.cloud/prop/qualifier/>
PREFIX gpqn: <https://greek-metrical-inscriptions.wikibase.cloud/prop/qualifier/value-normalized/>
PREFIX gpqv: <https://greek-metrical-inscriptions.wikibase.cloud/prop/qualifier/value/>
PREFIX gpr: <https://greek-metrical-inscriptions.wikibase.cloud/prop/reference/>
PREFIX gprn: <https://greek-metrical-inscriptions.wikibase.cloud/prop/reference/value-normalized/>
PREFIX gprv: <https://greek-metrical-inscriptions.wikibase.cloud/prop/reference/value/>
PREFIX gpsv: <https://greek-metrical-inscriptions.wikibase.cloud/prop/statement/value/>
PREFIX gps: <https://greek-metrical-inscriptions.wikibase.cloud/prop/statement/>
PREFIX gpsn: <https://greek-metrical-inscriptions.wikibase.cloud/prop/statement/value-normalized/>
PREFIX gd: <https://greek-metrical-inscriptions.wikibase.cloud/entity/>
PREFIX gdt: <https://greek-metrical-inscriptions.wikibase.cloud/prop/direct/>

SELECT ?inscriptions ?inscriptionslabel ?editionURL
WHERE {
  ?inscriptions gdt:P4 gd:Q698 ;
               gdt:P7 ?editionURL .
  ?inscriptions rdfs:label ?inscriptionslabel
  FILTER(LANG(?inscriptionslabel) = 'en')
}
ORDER BY ?inscriptionslabel
`;

    const encoded = encodeURIComponent(query.trim());

    const url =
      "https://greek-metrical-inscriptions.wikibase.cloud/query/#query=" + encoded;

    window.location.replace(url);
  </script>
</head>

Redirecting...
</body>
</html>
